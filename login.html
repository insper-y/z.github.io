<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝贝专属</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            display: none; /* 初始隐藏爱心 */
        }
        /* 密码弹窗样式 */
        .password-box {
            position: fixed;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            background: #111;
            border: 2px solid #ff69b4;
            border-radius: 16px;
            text-align: center;
            z-index: 999;
        }
        .password-box h2 {
            color: #ff69b4;
            margin-bottom: 25px;
            font-size: 22px;
        }
        #pwdInput {
            width: 100%;
            padding: 14px 16px;
            font-size: 18px;
            border: 1px solid #ff69b4;
            background: #000;
            color: #fff;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
        }
        #submitBtn {
            width: 100%;
            padding: 14px;
            background: #ff69b4;
            border: none;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        #tipText {
            margin-top: 15px;
            color: #ff4444;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- 密码弹窗 -->
    <div class="password-box" id="pwdWrap">
        <h2>请输入专属访问密码</h2>
        <input type="password" id="pwdInput" placeholder="输入密码">
        <button id="submitBtn">进入专属页面</button>
        <div id="tipText">密码错误，请重新输入</div>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        // 访问密码已修改为 890218
        const truePassword = "890218";
        
        const pwdWrap = document.getElementById('pwdWrap');
        const pwdInput = document.getElementById('pwdInput');
        const submitBtn = document.getElementById('submitBtn');
        const tipText = document.getElementById('tipText');

        // 密码校验逻辑
        function checkPassword() {
            const inputVal = pwdInput.value.trim();
            if(inputVal === truePassword) {
                // 密码正确，隐藏弹窗，显示爱心画布
                pwdWrap.style.display = 'none';
                canvas.style.display = 'block';
                // 启动爱心动画
                resizeCanvas();
                init();
                animate();
            } else {
                // 密码错误提示
                tipText.style.display = 'block';
                pwdInput.value = "";
            }
        }
        // 点击按钮验证
        submitBtn.addEventListener('click', checkPassword);
        // 按回车键验证
        pwdInput.addEventListener('keydown', e => {
            if(e.key === 'Enter') checkPassword();
        });

        // 自适应屏幕尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // 爱心参数方程（生成爱心轮廓）
        function getHeartPoint(t, scale, centerX, centerY) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return {
                x: x * scale + centerX,
                y: -y * scale + centerY
            };
        }

        // 小爱心粒子类
        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.size = Math.random() * 6 + 2; // 随机大小
                this.opacity = Math.random() * 0.6 + 0.4; // 随机透明度
                this.offset = Math.random() * Math.PI * 2; // 随机跳动相位
            }

            // 绘制小爱心
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff69b4'; // 粉色
                ctx.translate(this.x, this.y);
                ctx.scale(this.size / 16, this.size / 16); // 缩放爱心
                
                // 绘制小爱心路径
                ctx.beginPath();
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const p = getHeartPoint(t, 1, 0, 0);
                    if (t === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // 更新位置（实现跳动效果）
            update(time) {
                // 呼吸式跳动，不同粒子相位错开，更自然
                const beat = Math.sin(time * 3 + this.offset) * 0.05 + 1;
                const dx = this.baseX - canvas.width / 2;
                const dy = this.baseY - canvas.height / 2;
                this.x = canvas.width / 2 + dx * beat;
                this.y = canvas.height / 2 + dy * beat;
            }
        }

        let particles = [];
        let scale, centerX, centerY;

        // 初始化粒子（生成爱心轮廓）
        function init() {
            particles = [];
            scale = Math.min(canvas.width, canvas.height) / 35; // 爱心大小适配屏幕
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            // 沿爱心轮廓生成粒子
            for (let t = 0; t < Math.PI * 2; t += 0.02) {
                const p = getHeartPoint(t, scale, centerX, centerY);
                particles.push(new HeartParticle(p.x, p.y));
            }
        }

        // 动画循环
        function animate() {
            // 半透明黑底，实现拖尾/闪烁效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() / 1000;
            // 更新并绘制所有粒子
            for (let p of particles) {
                p.update(time);
                p.draw();
            }

            requestAnimationFrame(animate);
        }

        // 窗口大小变化时重新适配
        window.addEventListener('resize', () => {
            resizeCanvas();
            if(canvas.style.display === 'block') init();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李峋同款粉色爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // 自适应屏幕尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 爱心参数方程（生成爱心轮廓）
        function getHeartPoint(t, scale, centerX, centerY) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return {
                x: x * scale + centerX,
                y: -y * scale + centerY
            };
        }

        // 小爱心粒子类
        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.size = Math.random() * 6 + 2; // 随机大小
                this.opacity = Math.random() * 0.6 + 0.4; // 随机透明度
                this.offset = Math.random() * Math.PI * 2; // 随机跳动相位
            }

            // 绘制小爱心
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff69b4'; // 粉色
                ctx.translate(this.x, this.y);
                ctx.scale(this.size / 16, this.size / 16); // 缩放爱心
                
                // 绘制小爱心路径
                ctx.beginPath();
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const p = getHeartPoint(t, 1, 0, 0);
                    if (t === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            // 更新位置（实现跳动效果）
            update(time) {
                // 呼吸式跳动，不同粒子相位错开，更自然
                const beat = Math.sin(time * 3 + this.offset) * 0.05 + 1;
                const dx = this.baseX - canvas.width / 2;
                const dy = this.baseY - canvas.height / 2;
                this.x = canvas.width / 2 + dx * beat;
                this.y = canvas.height / 2 + dy * beat;
            }
        }

        let particles = [];
        const scale = Math.min(canvas.width, canvas.height) / 35; // 爱心大小适配屏幕
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // 初始化粒子（生成爱心轮廓）
        function init() {
            particles = [];
            // 沿爱心轮廓生成粒子
            for (let t = 0; t < Math.PI * 2; t += 0.02) {
                const p = getHeartPoint(t, scale, centerX, centerY);
                particles.push(new HeartParticle(p.x, p.y));
            }
        }

        // 动画循环
        function animate() {
            // 半透明黑底，实现拖尾/闪烁效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() / 1000;
            // 更新并绘制所有粒子
            for (let p of particles) {
                p.update(time);
                p.draw();
            }

            requestAnimationFrame(animate);
        }

        // 启动动画
        init();
        animate();

        // 窗口大小变化时重新适配
        window.addEventListener('resize', () => {
            resizeCanvas();
            init();
        });
    </script>
</body>
</html>
